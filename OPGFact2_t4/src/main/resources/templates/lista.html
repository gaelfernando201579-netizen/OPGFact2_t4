<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Lista de Materias</title></head>
<body>
    <h2 th:text="${titulo}"></h2>
    <h3>Lista de Materias</h3>
    <table border="1">
        <thead>
            <tr><th>Materia</th><th>Profesor</th></tr>
        </thead>
        <tbody>
            <tr th:each="materia : ${materias}">
                <td th:text="${materia.nombre}"></td>
                <td th:text="${materia.profesor != null ? materia.profesor : 'Sin asignar'}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
